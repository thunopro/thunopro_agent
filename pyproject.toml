[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thunopro-agent"
dynamic = ["version"]
description = "Commander-led six-pane tmux agent coordinator"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Khacthu" }]
keywords = ["tmux", "agents", "orchestration", "cli", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = []

[project.scripts]
thuno = "thunopro_agent.cli:main"

[tool.setuptools]
packages = ["thunopro_agent"]

[tool.setuptools.dynamic]
version = { attr = "thunopro_agent.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
